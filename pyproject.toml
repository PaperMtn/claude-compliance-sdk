[project]
name = "anthropic-compliance-sdk"
version = "0.0.0"
description = "Python SDK for the Anthropic Compliance API"
authors = [{ name = "PaperMtn", email = "me@papermtn.co.uk" }]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.11,<4.0"
keywords = ["anthropic", "claude", "compliance", "sdk", "ediscovery", "audit", "dlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx (>=0.27,<1.0)",
]

[project.urls]
Homepage = "https://github.com/PaperMtn/anthropic-compliance-sdk"
Repository = "https://github.com/PaperMtn/anthropic-compliance-sdk"
Issues = "https://github.com/PaperMtn/anthropic-compliance-sdk/issues"
Changelog = "https://github.com/PaperMtn/anthropic-compliance-sdk/blob/main/CHANGELOG.md"

[tool.poetry]
packages = [{ include = "anthropic_compliance_sdk", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-httpx = "^0.30"
pytest-cov = "^5.0"
black = "^24.0"
isort = "^5.13"
pylint = "^3.2"
mypy = "^1.10"
pre-commit = "^3.7"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
