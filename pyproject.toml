[project]
name = "claude-compliance-sdk"
version = "0.0.0"
description = "Community Python SDK for the Anthropic Compliance API"
authors = [{ name = "PaperMtn", email = "me@papermtn.co.uk" }]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.11,<4.0"
keywords = ["anthropic", "claude", "compliance", "sdk", "ediscovery", "audit", "dlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx (>=0.27,<1.0)",
]

[project.urls]
Homepage = "https://github.com/PaperMtn/claude-compliance-sdk"
Repository = "https://github.com/PaperMtn/claude-compliance-sdk"
Issues = "https://github.com/PaperMtn/claude-compliance-sdk/issues"
Changelog = "https://github.com/PaperMtn/claude-compliance-sdk/blob/main/CHANGELOG.md"

[tool.poetry]
packages = [{ include = "claude_compliance_sdk", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-httpx = "^0.30"
pytest-cov = "^5.0"
black = "^24.0"
isort = "^5.13"
pylint = "^3.2"
mypy = "^1.10"
pre-commit = "^3.7"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["claude_compliance_sdk"]
src_paths = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
files = ["src/claude_compliance_sdk"]

[[tool.mypy.overrides]]
module = "claude_compliance_sdk._internal.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: marks tests that require ANTHROPIC_COMPLIANCE_API_KEY and hit the live API (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["src/claude_compliance_sdk"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]
show_missing = true
skip_covered = false
